name: lint

# Self-CI for this repo: actionlint over every workflow. A YAML or
# expression error tagged into v1 breaks every consumer at once — this is
# the blast-radius guard.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  # actionlint proves the YAML is CORRECT; this proves it is SAFE — the two
  # are complementary. These workflows execute with consumers' secrets inside
  # consumers' repos, so a leak introduced here lands on every project at
  # once. The selftest runs the auditor against deliberately-broken fixtures
  # BEFORE the real scan, so a guard that has stopped catching anything fails
  # loudly instead of passing quietly. No install step: node is preinstalled
  # on the runner and the auditor has zero dependencies.
  security-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node scripts/audit-selftest.mjs
      - run: node scripts/audit-workflows.mjs .github/workflows

  # release.yml trusts next-version.mjs to decide what consumers receive; test it before it decides.
  release-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node --test scripts/next-version.test.mjs

  # The fleet report is run by hand with your gh login; its parsing and status rules are tested here.
  fleet-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node --test scripts/fleet-report.test.mjs

  # Runs scope.yml's classifier script against scratch repos with GitHub's default shell flags.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node --test scripts/scope.test.mjs
