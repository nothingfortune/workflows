name: CI (reusable)

# The gate: npm ci + npm run check. Callers own triggers and concurrency:
#
#   name: CI
#   on: { push: { branches: [main] }, pull_request: }
#   concurrency: { group: "ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}", cancel-in-progress: true }
#   jobs:
#     check:
#       uses: nothingfortune/workflows/.github/workflows/ci.yml@<sha> # v<X.Y.Z>

on:
  workflow_call:
    inputs:
      runner:
        description: 'Where the jobs run, as JSON: one runner label or an array of labels (default: "ubuntu-latest")'
        type: string
        required: false
        default: '"ubuntu-latest"'

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
