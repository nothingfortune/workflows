name: e2e (reusable)

# The expensive test layer: Playwright against the BUILT app. Skips on
# draft PRs; DORMANT until the project has a playwright.config.* (probe
# no-ops otherwise, so fresh template clones stay green). Run the
# reviews-done gate as `DRAFT_SKIPPED_CHECK=e2e bin/pr-reviews-done.sh` —
# GitHub counts a skipped job as satisfying a required check.
#
# Caller:
#   name: e2e
#   on:
#     push: { branches: [main] }
#     pull_request: { types: [opened, synchronize, reopened, ready_for_review] }
#   concurrency: { group: e2e-${{ github.ref }}, cancel-in-progress: true }
#   jobs:
#     e2e:
#       uses: nothingfortune/workflows/.github/workflows/e2e.yml@v1

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect Playwright adoption
        id: probe
        run: |
          if ls playwright.config.* >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No playwright.config.* — e2e layer not adopted yet; no-op."
          fi
      - if: steps.probe.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - if: steps.probe.outputs.present == 'true'
        run: npm ci
      - if: steps.probe.outputs.present == 'true'
        run: npm run build --if-present
      - if: steps.probe.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.probe.outputs.present == 'true'
        run: npm run test:e2e
