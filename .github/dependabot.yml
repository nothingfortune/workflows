version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
    groups:
      # One PR per week means one release for consumers, not one per action.
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      # Never chore/ci: those types do not release, so the bump would never reach consumers.
      prefix: 'build(deps)'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types track the Node runtime (.nvmrc); a newer major type-checks APIs that crash on it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      # chore does not release: dev-tool bumps must not cut a release.
      prefix: 'chore(deps)'
