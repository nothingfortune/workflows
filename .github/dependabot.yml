version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
    groups:
      # One PR per week means one release for consumers, not one per action.
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      # Never chore/ci: those types do not release, so the bump would never reach consumers.
      prefix: 'build(deps)'
